<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lumina — Livros, Ebooks &amp; Cultura</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            50: '#e8eef6',
                            100: '#c5d4e8',
                            200: '#9db5d9',
                            300: '#6e96c8',
                            400: '#4a7ab8',
                            500: '#2563EB',
                            600: '#1d56d4',
                            700: '#1E3A5F',
                            800: '#172d4d',
                            900: '#101f33',
                        },
                        destaque: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                        }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'Georgia', 'serif'],
                        body: ['"Source Sans 3"', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'marca': '0 2px 12px rgba(30, 58, 95, 0.12)',
                        'marca-lg': '0 8px 30px rgba(30, 58, 95, 0.18)',
                        'marca-xl': '0 12px 40px rgba(30, 58, 95, 0.22)',
                        'nav': '0 -2px 20px rgba(30, 58, 95, 0.08)',
                    },
                    borderRadius: {
                        'marca': '14px',
                        'marca-sm': '8px',
                        'marca-lg': '20px',
                        'marca-xl': '28px',
                        'nav': '18px',
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        :focus-visible { outline: 2px solid #2563EB; outline-offset: 2px; border-radius: 4px; }
        ::-webkit-scrollbar { width: 0; height: 0; }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        [data-tela]:not(.hidden) { animation: fadeSlideIn 0.28s ease-out both; }

        .ativo { color: #2563EB !important; }
        .ativo svg { stroke: #2563EB !important; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.92); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to { opacity: 0; transform: translateY(-20px) scale(0.92); }
        }
        .toast-enter { animation: toastIn 0.3s ease-out both; }
        .toast-exit { animation: toastOut 0.25s ease-in both; }

        @keyframes modalBgIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes modalCardIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-bg-anim { animation: modalBgIn 0.22s ease-out both; }
        .modal-card-anim { animation: modalCardIn 0.28s ease-out both; }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.35); }
            70% { box-shadow: 0 0 0 8px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .pulse-ring { animation: pulse-ring 1.5s ease-out infinite; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 0.95rem;
            padding: 12px 24px; border-radius: 14px; border: none; cursor: pointer;
            transition: all 0.2s ease; text-decoration: none; line-height: 1.2;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #2563EB; color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,0.3); }
        .btn-primary:hover { background: #1d56d4; box-shadow: 0 6px 20px rgba(37,99,235,0.4); }
        .btn-secondary { background: #1E3A5F; color: #fff; }
        .btn-secondary:hover { background: #172d4d; }
        .btn-outline { background: transparent; color: #2563EB; border: 1.5px solid #2563EB; }
        .btn-outline:hover { background: #2563EB; color: #fff; }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; border-radius: 10px; }
        .btn-block { width: 100%; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }

        .card {
            background: #fff; border-radius: 16px; padding: 16px;
            box-shadow: 0 2px 12px rgba(30, 58, 95, 0.08);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        .card:hover { box-shadow: 0 4px 20px rgba(30, 58, 95, 0.14); }
        .card-interactive { cursor: pointer; }
        .card-interactive:active { transform: scale(0.98); }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 20px; font-size: 0.75rem;
            font-weight: 600; font-family: 'Source Sans 3', sans-serif;
        }
        .badge-primary { background: #e8eef6; color: #1E3A5F; }
        .badge-success { background: #dcfce7; color: #15803d; }
        .badge-warning { background: #fef3c7; color: #b45309; }
        .badge-danger { background: #fee2e2; color: #dc2626; }
        .badge-info { background: #dbeafe; color: #2563EB; }

        .input-field {
            width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-family: 'Source Sans 3', sans-serif;
            font-size: 0.95rem; background: #fff; transition: all 0.2s ease;
            color: #1E3A5F;
        }
        .input-field:focus {
            outline: none; border-color: #2563EB;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .input-field::placeholder { color: #94a3b8; }
    </style>
</head>
<body class="bg-gray-900 font-body antialiased">

    <!-- ====== APLICATIVO / FRAME DO CELULAR ====== -->
    <div id="app-frame" class="mx-auto bg-marca-700 min-h-screen relative overflow-hidden" style="max-width: 390px;">

        <!-- Barra de Status -->
        <div class="sticky top-0 z-50 bg-marca-700 flex items-center justify-between px-6 pt-2 pb-1 select-none" style="max-width:390px;">
            <span id="status-time" class="text-white text-sm font-semibold tracking-wide" style="font-variant-numeric: tabular-nums;"></span>
            <div class="flex items-center gap-1.5">
                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3C7.46 3 3.34 4.78.29 7.67c-.18.18-.29.43-.29.71 0 .28.11.53.29.71l2.48 2.48c.18.18.43.29.71.29.27 0 .52-.11.7-.28.79-.74 1.69-1.36 2.66-1.85.33-.16.56-.5.56-.9v-1.6c1.15.38 2.39.58 3.67.58s2.52-.2 3.67-.58v1.6c0 .4.23.74.56.9.98.49 1.88 1.11 2.67 1.85.18.17.43.28.7.28.28 0 .53-.11.71-.29l2.48-2.48c.18-.18.29-.43.29-.71 0-.28-.11-.53-.29-.71C20.66 4.78 16.54 3 12 3z"/></svg>
                <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </div>
        </div>

        <!-- Área de Conteúdo das Telas -->
        <main id="conteudo-app" class="relative" style="min-height: calc(100vh - 64px);">
            <!-- TELAS -->
        </main>

        <!-- Navegação Inferior -->
        <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 bg-white shadow-nav z-50 flex items-center justify-around px-1 pb-1 pt-2" style="max-width:390px; border-radius: 20px 20px 0 0;" data-nav="home-vitrine">

            <button data-nav="home-vitrine" onclick="mostrarTela('home-vitrine')"
                class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl transition-all duration-200 text-marca-700/50 hover:text-marca-500 min-w-[56px] ativo">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125a2.25 2.25 0 002.25 2.25h3.75a2.25 2.25 0 002.25-2.25V15a2.25 2.25 0 012.25-2.25h1.5A2.25 2.25 0 0116.5 15v5.625a2.25 2.25 0 002.25 2.25h3.75a2.25 2.25 0 002.25-2.25V9.75M9 15h6"/></svg>
                <span class="text-[10px] font-semibold">Início</span>
            </button>

            <button data-nav="minha-biblioteca" onclick="mostrarTela('minha-biblioteca')"
                class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl transition-all duration-200 text-marca-700/50 hover:text-marca-500 min-w-[56px]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A9 9 0 006 18a2.25 2.25 0 012.25-2.25h10.5A2.25 2.25 0 0121 18a8.967 8.967 0 00-6-2.767V6.042z"/></svg>
                <span class="text-[10px] font-semibold">Biblioteca</span>
            </button>

            <button data-nav="detalhe-do-ebook" onclick="mostrarTela('detalhe-do-ebook')"
                class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl transition-all duration-200 text-marca-700/50 hover:text-marca-500 min-w-[56px]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 0010.5 5.106a7.5 7.5 0 00-5.197 10.697M21 21l-6.75-6.75"/></svg>
                <span class="text-[10px] font-semibold">Buscar</span>
            </button>

            <button data-nav="carrinho-de-compras" onclick="mostrarTela('carrinho-de-compras')"
                class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl transition-all duration-200 text-marca-700/50 hover:text-marca-500 min-w-[56px] relative">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"/></svg>
                <span id="nav-cart-badge" class="hidden absolute -top-0.5 right-1 w-4 h-4 bg-destaque-500 text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
                <span class="text-[10px] font-semibold">Carrinho</span>
            </button>

            <button data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')"
                class="flex flex-col items-center gap-0.5 py-1 px-2 rounded-xl transition-all duration-200 text-marca-700/50 hover:text-marca-500 min-w-[56px]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.25h15a1.5 1.5 0 001.5-1.5V18a5.25 5.25 0 00-10.5 0v.75a1.5 1.5 0 01-1.5 1.5H4.5z"/></svg>
                <span class="text-[10px] font-semibold">Perfil</span>
            </button>

        </nav>
    </div>

    <!-- ====== CONTÊINER DE TOASTS (global, fora do frame) ====== -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] flex flex-col gap-2 pointer-events-none" style="max-width:370px; width:calc(100% - 32px);"></div>

    <!-- ====== MODAL GENÉRICO (global) ====== -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-[9998] items-end sm:items-center justify-center">
        <div id="modal-backdrop" class="absolute inset-0 bg-black/50 modal-bg-anim"></div>
        <div id="modal-card" class="relative bg-white rounded-t-2xl sm:rounded-2xl w-full max-w-[390px] max-h-[80vh] flex flex-col modal-card-anim shadow-marca-xl">
            <div class="flex items-center justify-between p-5 pb-3 border-b border-gray-100">
                <h3 id="modal-titulo" class="font-display text-lg font-bold text-marca-700"></h3>
                <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100 transition-colors" aria-label="Fechar modal">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modal-conteudo" class="p-5 overflow-y-auto flex-1"></div>
            <div class="p-4 border-t border-gray-100 flex justify-end gap-2" id="modal-acoes"></div>
        </div>
    </div>

    <!-- Espaço para o conteúdo das telas + utilitários globais -->
    <script>
        // ====== UTILITÁRIOS GLOBAIS ======

        function brl(valor) {
            return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        }

        function dataBR(iso) {
            if (!iso) return '—';
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        }

        function toast(mensagem, tipo) {
            tipo = tipo || 'info';
            var container = document.getElementById('toast-container');
            var el = document.createElement('div');
            var cores = {
                ok: 'bg-emerald-600 text-white',
                erro: 'bg-red-600 text-white',
                info: 'bg-marca-700 text-white'
            };
            var icones = {
                ok: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
                erro: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>',
                info: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>'
            };
            el.className = 'toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-lg ' + (cores[tipo] || cores.info);
            el.innerHTML = icones[tipo] + '<span class="font-semibold text-sm flex-1">' + mensagem + '</span>';
            container.appendChild(el);
            setTimeout(function() {
                el.classList.remove('toast-enter');
                el.classList.add('toast-exit');
                setTimeout(function() { el.remove(); }, 250);
            }, 3000);
        }

        function abrirModal(html, titulo) {
            titulo = titulo || '';
            document.getElementById('modal-titulo').textContent = titulo;
            document.getElementById('modal-conteudo').innerHTML = html;
            document.getElementById('modal-acoes').innerHTML = '';
            var overlay = document.getElementById('modal-overlay');
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            document.body.style.overflow = 'hidden';
        }

        function fecharModal() {
            var overlay = document.getElementById('modal-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
            document.body.style.overflow = '';
        }

        document.getElementById('modal-backdrop').addEventListener('click', fecharModal);
        document.addEventListener('keydown', function(e) { if (e.key === 'Escape') fecharModal(); });

        // Atualiza relógio da barra de status
        function atualizarRelogio() {
            var agora = new Date();
            var h = agora.getHours().toString().padStart(2, '0');
            var m = agora.getMinutes().toString().padStart(2, '0');
            var el = document.getElementById('status-time');
            if (el) el.textContent = h + ':' + m;
        }
        atualizarRelogio();
        setInterval(atualizarRelogio, 30000);

        // ====== ROTEADOR ======
        function mostrarTela(id) {
            document.querySelectorAll('[data-tela]').forEach(function (s) {
                s.classList.toggle('hidden', s.dataset.tela !== id);
            });
            document.querySelectorAll('[data-nav]').forEach(function (b) {
                b.classList.toggle('ativo', b.dataset.nav === id);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        document.addEventListener('DOMContentLoaded', function () {
            mostrarTela('home-vitrine');
        });
    </script>

</body>
</html>
